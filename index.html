<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1758" />
    <meta name="description" content="Glimmer Grove is a luminous match-3 orchard." />
    <title>Glimmer Grove</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/game.css" />
    <style>
      html, body { margin: 0; background: #1a1448; height: 100%; }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
      <svg class="scene-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="hill-far" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6d4ea8"/>
            <stop offset="1" stop-color="#4d357e"/>
          </linearGradient>
          <linearGradient id="hill-mid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3f8f6a"/>
            <stop offset="1" stop-color="#246348"/>
          </linearGradient>
          <linearGradient id="hill-near" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2f7a52"/>
            <stop offset="1" stop-color="#184833"/>
          </linearGradient>
        </defs>
        <ellipse cx="1180" cy="150" rx="70" ry="70" fill="#fff1c9" opacity="0.9"/>
        <ellipse cx="1180" cy="150" rx="120" ry="120" fill="#ffe3a4" opacity="0.18"/>
        <path d="M0 560 C180 500 280 620 460 560 C680 480 760 640 980 560 C1160 500 1280 600 1440 540 L1440 900 L0 900 Z" fill="url(#hill-far)"/>
        <path d="M0 650 C220 590 340 720 560 650 C760 590 900 730 1120 650 C1260 610 1360 680 1440 640 L1440 900 L0 900 Z" fill="url(#hill-mid)"/>
        <path d="M0 760 C200 700 360 820 620 750 C860 690 1040 830 1280 760 L1440 740 L1440 900 L0 900 Z" fill="url(#hill-near)"/>
        <g fill="#143c2c">
          <rect x="90" y="560" width="18" height="90" rx="8"/>
          <ellipse cx="99" cy="540" rx="48" ry="36"/>
          <ellipse cx="70" cy="570" rx="34" ry="26"/>
          <ellipse cx="132" cy="572" rx="36" ry="28"/>
          <rect x="1260" y="530" width="20" height="110" rx="8"/>
          <ellipse cx="1270" cy="500" rx="58" ry="42"/>
          <ellipse cx="1230" cy="536" rx="40" ry="30"/>
          <ellipse cx="1316" cy="540" rx="42" ry="32"/>
        </g>
        <g fill="#1d5538">
          <rect x="40" y="690" width="14" height="70" rx="6"/>
          <ellipse cx="47" cy="676" rx="36" ry="28"/>
          <rect x="1328" y="680" width="16" height="80" rx="7"/>
          <ellipse cx="1336" cy="662" rx="42" ry="30"/>
        </g>
        <g>
          <circle cx="180" cy="800" r="10" fill="#ff8ab4"/>
          <circle cx="204" cy="812" r="7" fill="#ffd36a"/>
          <circle cx="160" cy="818" r="6" fill="#fff"/>
          <circle cx="1240" cy="810" r="10" fill="#b388ff"/>
          <circle cx="1266" cy="798" r="7" fill="#ff8ab4"/>
          <circle cx="1214" cy="792" r="6" fill="#ffe08a"/>
        </g>
      </svg>
      <div class="fireflies">
        <i style="left:18%;top:42%"></i>
        <i style="left:30%;top:28%;animation-delay:-1.2s"></i>
        <i style="left:62%;top:24%;animation-delay:-2s"></i>
        <i style="left:74%;top:40%;animation-delay:-3s"></i>
        <i style="left:48%;top:36%;animation-delay:-4s"></i>
        <i style="left:86%;top:30%;animation-delay:-2.4s"></i>
      </div>
      <div class="vignette"></div>
    </div>

    <svg width="0" height="0" hidden aria-hidden="true">
      <symbol id="i-coin" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="12.5" fill="#ffd56a" stroke="#c4842a" stroke-width="2"/>
        <circle cx="16" cy="16" r="8" fill="none" stroke="#fff6d2" stroke-width="1.6"/>
        <path d="M16 10c1.7 2.5 2.2 4 .1 6.4-2.1-2.2-1.6-4-.1-6.4z" fill="#2f9d4a"/>
      </symbol>
      <symbol id="i-star" viewBox="0 0 32 32">
        <path fill="#ffe08a" stroke="#e2a33a" stroke-width="1.2" stroke-linejoin="round" d="M16 4.5 19.4 12l8.1.8-6.1 5.3 1.8 7.9L16 22.2 8.8 26l1.8-7.9L4.5 12.8 12.6 12z"/>
      </symbol>
      <symbol id="i-star-dim" viewBox="0 0 32 32">
        <path fill="rgba(255,255,255,.35)" d="M16 4.5 19.4 12l8.1.8-6.1 5.3 1.8 7.9L16 22.2 8.8 26l1.8-7.9L4.5 12.8 12.6 12z"/>
      </symbol>
      <symbol id="i-back" viewBox="0 0 32 32">
        <path d="M19 7 10 16l9 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 32 32">
        <path d="M9 9l14 14M23 9 9 23" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-gear" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M16 4.5v3.2M16 24.3v3.2M4.5 16h3.2M24.3 16h3.2M7.6 7.6l2.3 2.3M22.1 22.1l2.3 2.3M24.4 7.6l-2.3 2.3M9.9 22.1l-2.3 2.3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-pause" viewBox="0 0 32 32">
        <rect x="9" y="7" width="5" height="18" rx="2" fill="currentColor"/>
        <rect x="18" y="7" width="5" height="18" rx="2" fill="currentColor"/>
      </symbol>
      <symbol id="i-lock" viewBox="0 0 32 32">
        <rect x="8" y="14" width="16" height="12" rx="3" fill="currentColor"/>
        <path d="M11 14v-3a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/>
      </symbol>
      <symbol id="i-hammer" viewBox="0 0 32 32">
        <rect x="5" y="12" width="15" height="8" rx="2.5" fill="#ffd39a" stroke="#8a5520" stroke-width="1.4"/>
        <path d="M18 16h8M24 16v9" stroke="#8a5520" stroke-width="3" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-shuffle" viewBox="0 0 32 32">
        <path d="M6 10h8c4 0 6 4 8 6M22 8l4 2-2 4M6 22h8c4 0 6-4 8-6" fill="none" stroke="#b6f3e4" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="11" fill="#ffe7a8" stroke="#c4842a" stroke-width="1.6"/>
        <path d="M16 10v12M10 16h12" stroke="#8a5520" stroke-width="2.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-gift" viewBox="0 0 32 32">
        <rect x="6" y="14" width="20" height="12" rx="2" fill="#ff8ab4"/>
        <rect x="5" y="10" width="22" height="6" rx="2" fill="#ffd36a"/>
        <path d="M16 10v16" stroke="#fff6e8" stroke-width="2"/>
        <path d="M16 10c-2-4-7-3-6 0M16 10c2-4 7-3 6 0" fill="none" stroke="#fff6e8" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    </svg>

    <div id="app">
      <section id="screen-loader" class="screen loader-screen active">
        <div class="logo-lockup" id="loader-logo"></div>
        <p data-i18n="loading">Waking the grove…</p>
        <div class="loader-bar" aria-hidden="true"><i></i></div>
      </section>

      <section id="screen-menu" class="screen">
        <header class="topbar">
          <button class="profile-chip" type="button" data-action="profile">
            <span class="avatar" id="menu-avatar"></span>
            <span class="profile-copy">
              <strong class="js-name"></strong>
              <small data-i18n="progress"></small>
            </span>
          </button>
          <div class="top-actions">
            <button class="coin-pill" type="button" data-action="shop" aria-label="Coins">
              <svg><use href="#i-coin"/></svg>
              <strong class="js-coins">0</strong>
            </button>
            <button class="icon-btn" type="button" data-action="settings" data-i18n-aria="settings">
              <svg><use href="#i-gear"/></svg>
            </button>
          </div>
        </header>
        <div class="menu-layout">
          <div class="menu-hero">
            <div class="logo-slot"></div>
            <p class="tagline" data-i18n="tagline"></p>
            <button class="btn btn-primary btn-xl" type="button" data-action="play"><span data-i18n="play"></span></button>
            <div class="menu-secondary">
              <button class="btn btn-glass" type="button" data-action="levels" data-i18n="levels"></button>
              <button class="btn btn-glass" type="button" data-action="shop" data-i18n="shop"></button>
              <button class="btn btn-glass" type="button" data-action="rewards" data-i18n="rewards"></button>
            </div>
            <div class="menu-fruits" id="menu-fruits"></div>
          </div>
          <aside class="menu-card panel">
            <h2 data-i18n="current"></h2>
            <p id="menu-next"></p>
            <div class="stat-row">
              <div class="stat"><b id="stat-level">1</b><span data-i18n="level"></span></div>
              <div class="stat"><b id="stat-stars">0</b><span data-i18n="stars"></span></div>
            </div>
            <button class="btn btn-primary" type="button" data-action="rewards" style="width:100%">
              <span data-i18n="daily"></span>
            </button>
          </aside>
        </div>
      </section>

      <section id="screen-map" class="screen">
        <header class="topbar">
          <button class="icon-btn" type="button" data-action="menu" data-i18n-aria="back"><svg><use href="#i-back"/></svg></button>
          <h1 data-i18n="levels"></h1>
          <button class="coin-pill" type="button" data-action="shop"><svg><use href="#i-coin"/></svg><strong class="js-coins">0</strong></button>
        </header>
        <div id="map-scroll" class="map-scroll"></div>
      </section>

      <section id="screen-game" class="screen">
        <header class="topbar game-top">
          <button class="icon-btn" type="button" data-action="pause" data-i18n-aria="pause"><svg><use href="#i-pause"/></svg></button>
          <div class="level-chip">
            <small id="game-chapter"></small>
            <strong id="game-level"></strong>
          </div>
          <button class="coin-pill" type="button" data-action="shop-game"><svg><use href="#i-coin"/></svg><strong class="js-coins">0</strong></button>
        </header>
        <div class="game-body">
          <section class="goals-panel panel">
            <div class="score-float"><strong id="score-mobile">0</strong><span data-i18n="score"></span></div>
            <div class="goals-head">
              <h2 data-i18n="goals"></h2>
              <div class="score-inline"><span data-i18n="score"></span><strong id="score-value">0</strong></div>
            </div>
            <div id="goal-list" class="goal-list"></div>
            <div class="star-track" id="star-track">
              <div class="star-track-fill" id="star-fill"></div>
              <i class="mark"></i><i class="mark"></i><i class="mark"></i>
            </div>
          </section>
          <div class="board-stage" id="board-stage">
            <canvas id="board" width="320" height="320"></canvas>
            <div id="combo-banner" class="combo-banner"></div>
            <div id="status-banner" class="status-banner"></div>
          </div>
          <aside class="side-panel panel">
            <div class="moves-orb" id="moves-orb">
              <strong id="moves-value">0</strong>
              <span data-i18n="moves"></span>
            </div>
            <div class="booster-row" id="booster-row"></div>
          </aside>
        </div>
      </section>

      <section id="screen-shop" class="screen">
        <header class="topbar">
          <button class="icon-btn" type="button" data-action="back" data-i18n-aria="back"><svg><use href="#i-back"/></svg></button>
          <h1 data-i18n="shop"></h1>
          <button class="coin-pill" type="button"><svg><use href="#i-coin"/></svg><strong class="js-coins">0</strong></button>
        </header>
        <div id="shop-grid" class="shop-grid"></div>
      </section>

      <section id="screen-rewards" class="screen">
        <header class="topbar">
          <button class="icon-btn" type="button" data-action="menu" data-i18n-aria="back"><svg><use href="#i-back"/></svg></button>
          <h1 data-i18n="rewards"></h1>
          <button class="coin-pill" type="button" data-action="shop"><svg><use href="#i-coin"/></svg><strong class="js-coins">0</strong></button>
        </header>
        <div class="reward-layout">
          <article class="chest-card panel">
            <div class="chest" id="chest"><div class="chest-lid"></div><div class="chest-body"></div><div class="chest-lock"></div></div>
            <h2 data-i18n="daily"></h2>
            <p class="sub" id="chest-copy"></p>
            <button class="btn btn-primary" type="button" id="btn-claim" data-action="claim"></button>
          </article>
          <article class="album panel">
            <h2 data-i18n="progress"></h2>
            <div class="album-grid" id="album-stats"></div>
          </article>
        </div>
      </section>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="icon-btn modal-x" type="button" data-close="1" data-i18n-aria="close"><svg><use href="#i-close"/></svg></button>
        <div id="modal-body"></div>
      </div>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
